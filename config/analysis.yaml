# Canonical analysis configuration for the BlockBench paper tables.
# Verified to reproduce Table 3 (all 35 DS cells and all 49 TC cells) exactly.
# Source of truth: scripts/aggregate_majority_vote.py:474 in Block-Bench/evaluation.

judges:
  ds:  [glm-4.7, mimo-v2-flash, mistral-large]
  tc:  [glm-4.7, mimo-v2-flash, mistral-large]
  gs:  [glm-4.7]            # see docs/OPEN_QUESTIONS.md

vote:
  ds: majority_2_of_3
  tc: majority_2_of_3
  gs: single_judge

target_found:
  ds: complete_or_partial   # complete_found OR partial_found
  tc: complete_or_partial
  gs: complete_only         # complete_found only

# Files beginning with "_" are per-tier/per-variant aggregates, not samples.
exclude_basename_prefix: "_"

ds_sample_counts: {tier1: 20, tier2: 37, tier3: 30, tier4: 13}

# The DS "Avg" column in Table 3 is the UNWEIGHTED mean of the four tier
# rates, not the sample-weighted overall rate (86.5 vs 84.0 for Claude).
ds_avg: unweighted_tier_mean

statistics:
  bootstrap_resamples: 1000
  bootstrap_method: percentile
  confidence: 0.95
  paired_test: mcnemar_continuity_corrected
  multiple_comparison_correction: holm

# Judges present in the raw data but NOT used for any published number.
# A superseded pipeline (scripts/resultscripts/generate_table1.py) averaged
# per-judge rates over these; its output is an older snapshot.
unused_judges: [codestral, gemini-3-flash]
